services:
  searxng:
    image: searxng/searxng:latest
    container_name: buddhi-searxng-dev
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY:-changeme-generate-a-random-string}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
