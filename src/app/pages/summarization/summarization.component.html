<!--begin::App Content Header-->
<div class="app-content-header">
  <!--begin::Container-->
  <div class="container-fluid">
    <!--begin::Row-->
    <div class="row">
      <div class="col-sm-6"><h3 class="mb-0">Summarizer</h3></div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-end">
          <li class="breadcrumb-item"><a [routerLink]="'/'">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">Summarizer</li>
        </ol>
      </div>
    </div>
    <!--end::Row-->
  </div>
  <!--end::Container-->
</div>
<!--end::App Content Header-->
<!--begin::App Content-->
<div class="app-content">
  <!--begin::Container-->
  <div class="container-fluid">
    <!--begin::Row-->
    <div class="row">
      <div class="col-12">
        <!-- Default box -->
        <div class="card card-primary card-outline mb-4">
          <!--begin::Form-->
          <form [formGroup]="toolForm">
            <!--begin::Body-->
            <div class="card-body">
              <div class="mb-3">
                <label class="form-label">Text to summarize</label>
                <textarea
                  class="form-control"
                  rows="6"
                  formControlName="content"
                ></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label">Summarized text</label>
                <textarea
                  class="form-control"
                  rows="6"
                  readonly
                  formControlName="response"
                ></textarea>
              </div>
            </div>
            <!--end::Body-->
            <!--begin::Footer-->
            <div class="card-footer">
              <button
                type="submit"
                class="btn btn-primary me-2"
                [disabled]="inProgress || toolForm.invalid"
                (click)="summarize()"
              >
                {{ inProgress ? "Summarizing..." : "Summarize" }}
              </button>
              <button
                class="btn btn-secondary"
                [disabled]="inProgress || toolForm.invalid"
                (click)="clearContent()"
              >
                Clear
              </button>
            </div>
            <!--end::Footer-->
          </form>
          <!--end::Form-->
        </div>
        <!-- /.card -->
      </div>
    </div>
    <!--end::Row-->
  </div>
  <!--end::Container-->
</div>
<!--end::App Content-->
