services:
  searxng:
    image: searxng/searxng:latest
    container_name: buddhi-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY:-changeme-generate-a-random-string}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  opensandbox:
    image: docker.io/opensandbox/server:latest
    container_name: buddhi-opensandbox
    ports:
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./sandbox/.sandbox.toml:/etc/opensandbox/config.toml:ro
    environment:
      OPENSANDBOX_CONFIG: /etc/opensandbox/config.toml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: buddhilive/ai-studio-service:${AI_STUDIO_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8765:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:54321"]'}
      ENABLE_TRACE_LOGGING: ${ENABLE_TRACE_LOGGING:-true}
      TRACE_RETENTION_DAYS: ${TRACE_RETENTION_DAYS:-30}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      OPENSANDBOX_SERVER_URL: ${OPENSANDBOX_SERVER_URL:-http://opensandbox:8080}
    depends_on:
      searxng:
        condition: service_healthy
      opensandbox:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: buddhilive/ai-studio-ui:${AI_STUDIO_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "54321:3000"
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8000}
    depends_on:
      - backend
    restart: unless-stopped
