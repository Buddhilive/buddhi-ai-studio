# OpenSandbox Configuration for Buddhi AI Studio

[server]
host = "0.0.0.0"
port = 8080
api_key = "changeme-opensandbox-key"

[runtime]
type = "docker"
execd_image = "opensandbox/execd:latest"

[docker]
network_mode = "bridge"
host_ip = "host.docker.internal"

[egress]
image = "opensandbox/egress:latest"
mode = "dns+nft"
