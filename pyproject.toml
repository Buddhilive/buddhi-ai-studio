[project]
name = "buddhi-ai-studio"
version = "0.1.0"
readme = "README.md"
description = "Buddhi AI Studio"

requires-python = ">=3.9"

dependencies = [
    "pyloid",
    "pyloid-adapter",
    "fastapi",
    "uvicorn",
    "llama-cpp-python>=0.3.16",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.11.0",
    "huggingface-hub>=1.3.3",
    "aiofiles>=24.1.0",
]

[dependency-groups]
dev = [
    "pyloid-builder",
    "pyloid-watcher",
    "ruff",
]
